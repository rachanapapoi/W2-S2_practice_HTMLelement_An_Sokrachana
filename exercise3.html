<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 3</title>

    <style>
        .container{
            display: grid;
            grid-template-rows: repeat(3,1fr);
            gap: 5px;
            width: 100%;
            height: 100px;
        }

        .head{
            background-color: black;
            color:white;
            text-align: center;
            padding: 30px;
        }

        .middle{
            display: grid;
            grid-template-columns: 75% 25%;
            gap: 10px;
            padding: 10px;
            padding-right: 20px;
        }

        .Main{
            background-color: rgb(234, 230, 230);
            padding: 5px;
        }

        .Side{
            background-color: rgb(205, 201, 201);
            padding: 5px;
        }

        .footer{
            background-color: black;
            color:white;
            text-align: center;
            padding: 30px;
        }

        @media (max-width: 900px){
            .head{
                background-color: black;
                color:white;
                text-align: center;
                padding: 10px;
            }

            .middle{
                display: grid;
                grid-template-columns: repeat(2,1fr);
                gap: 10px;
                padding: 10px;
                padding-right: 20px;
            }

            .footer{
                background-color: black;
                color:white;
                text-align: center;
                padding: 10px;
            }


        }

        @media (max-width: 600px){
            .head{
                background-color: black;
                color:white;
                text-align: center;
                padding: 10px;
            }

            .middle{
                display: grid;
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 10px;
                padding-right: 20px;
            }

            .footer{
                background-color: black;
                color:white;
                text-align: center;
                padding: 10px;
            }


        }
    </style>
</head>
<body>
    <div class="container">
        <div class="head">Responsive Header</div>
        <div class="middle">
            <div class="Main">Main Content</div>
            <div class="Side">Sidebar</div>
        </div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
