<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            display: flex;
            gap: 1.5rem;
            flex-direction: column;
            margin: 1rem;
            height: 100vh;
        }

        .b1{
            background-color: #1e90ff;
            box-shadow: #0077ea;
            padding: 20px;
            width: 100%;
            height: 200px;
        }

        .b2{
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            flex-grow: 1;
            gap: 12px;
        }

        .main{
            display: flex;
            flex-wrap: wrap;
            background-color: #3cb371;
            box-shadow: #2f8d59;
            gap: 10px;
            flex: 1;
        }

        p{
            width: 100%;
            height: 10px;
        }

        .item{
            padding: 20px;
            height: 30px;
            background-color: #2f8d59;
            box-shadow: #226741;
            margin: 20px;
        }

        .b3{
            background-color: #ff6347;
            box-shadow: #e04c36;
            width: 200px;
        }

        .b4{
            background-color: #4169e1;
            box-shadow: #1d44b8;
            padding: 20px;
            width: 100%;
            height: 100px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="b1">Header</div>
        <div class="b2">
            
            <div class="main">
                <p>Main</p>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
            </div>
            <div class="b3">Sidebar</div>
        </div>
        <div class="b4">Footer</div>
    </div>
</body>
</html>
