<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }

      .pricing-container{
        display: flex;
        flex-direction: row;
        background-color: rgb(199, 196, 196);
        justify-content: center;
        gap: 50px;
        padding: 30px 10px;
      }

      .pricing-plan{
        display: flex;
        flex-direction: column;
        background-color: white;
        text-align: center;
        width: 260px;
        border-radius: 30px;
        height: 400px;
        justify-content: space-between;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
      }

      .plan-title{
        border-top-left-radius: 30px;
        border-top-right-radius: 30px;
        color:rgb(243, 248, 250);
        margin: 0;
        padding: 22px 0;
        font-size: 25px;
      }

      .basic .plan-title{
        background-color: rgb(241, 48, 48);
      }

      .standard .plan-title{
        background-color:  rgb(110, 162, 240);
      }

      .premium .plan-title{
        background-color:  rgb(199, 85, 248);
      }

      .plan-price{
        font-size: 25px;
        color:rgb(3, 21, 36);
        padding-top: 20px;
      }

      .plan-features{
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 160px;
        background-color: rgb(235, 232, 232);
        margin: 20px;
        border-radius: 40px;
        padding: 30px;
        color:rgb(183, 7, 7);
      }

      .plan-button{
        display:flex;
        margin: 20px;
        width: 100px;
        align-self: center;
        background-color: rgb(245, 161, 5);
        color:white;
        height: 40px;
        border-radius: 30px;
        padding: 10px 20px 15px 25px;
        border: solid;
      }

      .plan-button:hover{
        background-color: rgb(164, 89, 3);
      }

      /* Hint: What can you do with a media query and flexbox? */
      
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan basic">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          
          <li>✅ 1 User</li>
          
          <li>🚫 Support</li>
          
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan standard">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan premium">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
