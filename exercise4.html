<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4</title>

    <style>
        .wrapper{
            background-color: rgb(199, 198, 198);
            width: 100%;
            height: 100vh;
        }

        .content{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .big{
            display:flex;
            background-color: rgb(49, 235, 49);
            padding: 20px 20px;
            justify-content: center;
            font-size: 40px;
            align-items: center;
            color: white;
            height: 95vh;
            width: clamp(300px,100%,800px);
        }

        .small{
            display: none;
            background-color: red;
            justify-content: center;
            align-items: center;
            height: 70px;
            padding: 0px 20px;
            color: white;
        }

        @media (max-width: 350px){

            .small{
                display: flex;
            }
            .big{
                display: none;
            }
        }
        
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="content">
            <span class="small">I'm SMALL 😢</span>
            <span class="big">I'm BIG 😱</span>
        </div>
    </div>
</body>
</html>
